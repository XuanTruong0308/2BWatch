services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: 2bshop-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 2bshop-web:1.0.0
    container_name: 2bshop-app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
      APP_UPLOAD_DIR: /data/uploads
      APP_UPLOAD_WATCH: /data/uploads/watches
      APP_UPLOAD_USER: /data/uploads/users
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/data/uploads
    restart: unless-stopped

volumes:
  sqlserver-data:
  uploads-data:
